<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <button id="btn-theme-toggle" type="button" class="btn-theme-toggle">Dark Mode</button>
    </header>

    <main class="dashboard">

      <!-- Greeting Widget -->
      <section id="greeting-widget" class="widget">
        <div id="time" aria-live="polite" aria-label="Current time"></div>
        <div id="date" aria-label="Current date"></div>
        <div id="greeting" aria-label="Greeting message"></div>
        <div class="name-input-row">
          <label for="name-input" class="sr-only">Your name</label>
          <input id="name-input" type="text" maxlength="50" placeholder="Enter your name…" autocomplete="off" />
          <button id="btn-save-name" type="button">Save</button>
        </div>
      </section>

      <!-- Focus Timer -->
      <section id="focus-timer" class="widget">
        <h2 class="widget-title">Focus Timer</h2>
        <div id="timer-display" aria-live="polite" aria-label="Timer display">25:00</div>
        <div class="timer-controls">
          <button id="btn-start" type="button">Start</button>
          <button id="btn-stop" type="button" disabled>Stop</button>
          <button id="btn-reset" type="button">Reset</button>
        </div>
        <div id="timer-ended" class="timer-ended-indicator" hidden aria-live="assertive">
          Session complete!
        </div>
        <div class="duration-row">
          <label for="duration-input" class="sr-only">Timer duration in minutes</label>
          <input id="duration-input" type="number" min="1" max="180" value="25" aria-describedby="duration-error" />
          <button id="btn-set-duration" type="button">Set</button>
        </div>
        <p id="duration-error" class="validation-error" role="alert" aria-live="polite"></p>
      </section>

      <!-- To-Do List -->
      <section id="todo-list" class="widget">
        <h2 class="widget-title">To-Do List</h2>
        <div class="todo-add-row">
          <label for="todo-input" class="sr-only">New task description</label>
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task…"
            autocomplete="off"
            aria-describedby="todo-error"
          />
          <button id="btn-add-todo" type="button">Add</button>
        </div>
        <div class="sort-row">
          <label for="task-sort" class="sr-only">Sort tasks by</label>
          <select id="task-sort" aria-label="Sort tasks">
            <option value="creation">Creation order</option>
            <option value="completed-last">Completed last</option>
            <option value="alpha">Alphabetical (A–Z)</option>
          </select>
        </div>
        <p id="todo-error" class="validation-error" role="alert" aria-live="polite"></p>
        <ul id="task-list" aria-label="Task list"></ul>
      </section>

      <!-- Quick Links -->
      <section id="quick-links" class="widget">
        <h2 class="widget-title">Quick Links</h2>
        <div class="links-add-form">
          <label for="link-label" class="sr-only">Link label</label>
          <input
            id="link-label"
            type="text"
            placeholder="Label"
            autocomplete="off"
            aria-describedby="link-error"
          />
          <label for="link-url" class="sr-only">Link URL</label>
          <input
            id="link-url"
            type="url"
            placeholder="https://example.com"
            autocomplete="off"
            aria-describedby="link-error"
          />
          <button id="btn-add-link" type="button">Add</button>
        </div>
        <p id="link-error" class="validation-error" role="alert" aria-live="polite"></p>
        <div id="links-container" aria-label="Quick links"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
